name: CI

on:
  workflow_dispatch:

jobs:
  build1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run first job
        run: |
          echo "Repository name: ${{ github.repository }}"
          echo "Job details: ${{ job.status }}"

  build2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run second job
        run: |
          echo "Runner details: ${{ runner.os }}"
